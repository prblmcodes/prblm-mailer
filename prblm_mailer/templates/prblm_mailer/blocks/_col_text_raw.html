{% load wagtailcore_tags %}<div style="text-align:{{ value.align }};word-break:break-word;overflow-wrap:break-word">{% if value.heading %}<div style="font-family:Montserrat,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.25;color:{{ text_hex }};margin:0 0 10px">{{ value.heading }}</div>{% endif %}{% if value.description %}<div class="body-content" style="font-family:Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:{{ muted_hex }};margin:0 0 14px">{{ value.description|richtext }}</div>{% endif %}{% if value.button_text %}<a href="{{ value.button_url }}" style="display:inline-block;background:{{ button_bg_fallback }};background:{{ button_bg }};color:{{ button_text_hex }};padding:11px 26px;border-radius:6px;font-family:Montserrat,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;text-decoration:none">{{ value.button_text }}</a>{% endif %}</div>
