{% comment %}One icon: a plain glyph, or a glyph centred on a coloured chip.{% endcomment %}{% if plain %}{% if item.icon %}<img src="{{ item.icon }}" alt="{{ item.label }}" width="{{ glyph_px }}" height="{{ glyph_px }}" style="display:block;border:0;outline:none;width:{{ glyph_px }}px;height:{{ glyph_px }}px">{% else %}<span style="font-family:Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:{{ text_hex }}">{{ item.label }}</span>{% endif %}{% else %}<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="display:inline-table;border-collapse:separate"><tr><td align="center" valign="middle" width="{{ box_px }}" height="{{ box_px }}" bgcolor="{{ item.chip }}" style="width:{{ box_px }}px;height:{{ box_px }}px;background:{{ item.chip }};border-radius:{{ radius }};text-align:center;vertical-align:middle">{% if item.icon %}<img src="{{ item.icon }}" alt="{{ item.label }}" width="{{ glyph_px }}" height="{{ glyph_px }}" style="display:block;border:0;outline:none;margin:0 auto;width:{{ glyph_px }}px;height:{{ glyph_px }}px">{% else %}<span style="font-family:Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:#ffffff">{{ item.label|slice:":1" }}</span>{% endif %}</td></tr></table>{% endif %}
