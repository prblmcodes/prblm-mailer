# Publish a GitHub Release whenever a version tag (v0.6.0b1, v1.0.0, …) is pushed.
#
# Hosts install from the tag (`prblm-mailer @ git+…@vX`), so a tag is a release whether or
# not this runs — the gate is here so a tag whose code fails on either end of the supported
# range never gets a Release page that looks like an endorsement.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests · Wagtail ${{ matrix.wagtail }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range plus the middle — see CLAUDE.md "Testing".
        include:
          - { wagtail: "6.0", django: "5.0", pins: "'wagtail>=6.0,<6.1' 'Django>=5.0,<5.1'" }
          - { wagtail: "7", django: "5.2", pins: "'wagtail>=7,<8' 'Django>=5.2,<5.3'" }
          - { wagtail: "8.1", django: "6.1", pins: "'wagtail>=8.1,<9' 'Django>=6.1,<6.2' 'django-newsletter>=1.3,<1.4'" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Each pin is single-quoted in the matrix: an unquoted `<` is a shell redirect.
          pip install -e . ${{ matrix.pins }}
      - name: Run the suite
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PYTHONPATH: .
        run: python -m django test tests

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release and upload the built files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
          # An editable install hides missing package data; a wheel without templates is
          # a broken release. Fail rather than publish one.
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          templates = sum(n.endswith(".html") for n in names)
          static = sum("/static/" in n for n in names)
          print(f"wheel: {templates} templates, {static} static files")
          assert templates and static, "wheel is missing templates or static files"
          EOF

      - name: Write release notes
        run: |
          {
            # The tagged commit's message is the changelog entry; drop trailer lines.
            git log -1 --format=%B "$GITHUB_REF_NAME" | grep -v -E '^(Co-Authored-By|Signed-off-by):'
            echo
            echo "## Install"
            echo
            echo '```'
            echo "prblm-mailer @ git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_REF_NAME}"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # PEP 440 pre-releases (0.6.0b1, 1.0.0rc2, 1.1.0a1) are marked as such.
          prerelease=""
          if [[ "$tag" =~ [0-9](a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # Someone already published it by hand: keep their text, just attach the builds.
            echo "Release $tag exists; uploading build files only."
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "prblm-mailer ${tag#v}" \
              --notes-file notes.md \
              --verify-tag $prerelease
          fi
