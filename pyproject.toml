[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prblm-mailer"
version = "0.1.0"
description = "Self-hosted Wagtail newsletter platform (Mailgun + django-newsletter + MJML)."
readme = "README.md"
requires-python = ">=3.12"
# Pinned to what beMore runs. Supporting a range is work two internal sites don't need.
dependencies = [
    "Django>=5.0,<5.3",
    "wagtail>=6.0,<8",
    "django-newsletter>=1.2,<1.3",
    "django-anymail>=10,<16",
    "mrml>=0.2,<0.3",
    "sorl-thumbnail>=13,<14",   # django-newsletter dependency
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4"]

[tool.setuptools.packages.find]
include = ["prblm_mailer*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
