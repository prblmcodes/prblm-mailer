[build-system]
requires = ["setuptools>=77"]   # SPDX `license` expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "prblm-mailer"
version = "0.6.0b1"
description = "Self-hosted Wagtail newsletter platform (Mailgun + django-newsletter + MJML)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["wagtail", "django", "newsletter", "email", "mailgun", "mjml", "double-opt-in"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
# Upper bounds are the newest versions the suite has been run on, not known breakage:
# widen them only after a green run on both ends of the range (see CLAUDE.md).
dependencies = [
    "Django>=5.0,<6.2",
    "wagtail>=6.0,<9",
    "django-newsletter>=1.2,<1.4",
    "django-anymail>=10,<16",
    "mrml>=0.2,<0.3",
    "sorl-thumbnail>=13,<14",   # django-newsletter dependency
]

[project.urls]
Homepage = "https://github.com/prblmcodes/prblm-mailer"
Documentation = "https://github.com/prblmcodes/prblm-mailer#documentation"
Changelog = "https://github.com/prblmcodes/prblm-mailer/blob/main/CHANGELOG.md"
Releases = "https://github.com/prblmcodes/prblm-mailer/releases"
Issues = "https://github.com/prblmcodes/prblm-mailer/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4"]

[tool.setuptools.packages.find]
include = ["prblm_mailer*"]

# Templates and the admin JS are not importable modules, so a wheel drops them
# unless they are named here — an editable install hides this by using the source tree.
[tool.setuptools.package-data]
prblm_mailer = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
